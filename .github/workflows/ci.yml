name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  test:
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        gemfile:
          - test/gemfiles/rails_6_0.gemfile
          - test/gemfiles/rails_6_1.gemfile
          - test/gemfiles/rails_7_0_dartsass.gemfile
          - test/gemfiles/rails_7_1.gemfile
          - test/gemfiles/rails_7_2.gemfile
          - test/gemfiles/rails_8_0.gemfile
          - test/gemfiles/rails_8_1.gemfile
          # Propshaft + dartsass-rails + importmap-rails, the default stack of `rails new`.
          - test/gemfiles/rails_8_1_propshaft.gemfile
        exclude:
          # Rails 7.2 requires Ruby 3.1+.
          - { ruby_version: '2.7', gemfile: test/gemfiles/rails_7_2.gemfile }
          - { ruby_version: '3.0', gemfile: test/gemfiles/rails_7_2.gemfile }
          # Rails 8 requires Ruby 3.2+.
          - { ruby_version: '2.7', gemfile: test/gemfiles/rails_8_0.gemfile }
          - { ruby_version: '3.0', gemfile: test/gemfiles/rails_8_0.gemfile }
          - { ruby_version: '3.1', gemfile: test/gemfiles/rails_8_0.gemfile }
          - { ruby_version: '2.7', gemfile: test/gemfiles/rails_8_1.gemfile }
          - { ruby_version: '3.0', gemfile: test/gemfiles/rails_8_1.gemfile }
          - { ruby_version: '3.1', gemfile: test/gemfiles/rails_8_1.gemfile }
          - { ruby_version: '2.7', gemfile: test/gemfiles/rails_8_1_propshaft.gemfile }
          - { ruby_version: '3.0', gemfile: test/gemfiles/rails_8_1_propshaft.gemfile }
          - { ruby_version: '3.1', gemfile: test/gemfiles/rails_8_1_propshaft.gemfile }
        include:
          - ruby_version: '2.6'
            gemfile: test/gemfiles/rails_6_0.gemfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true # 'bundle install' and cache
      - name: Disable AppArmor # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The first page Chrome opens on a fresh runner takes 10-50s (later ones
      # take <1s, even in new browser processes), which exceeds Ferrum's 30s
      # command timeout in the first browser test. Pay that cold start here.
      - name: Warm up Chrome
        run: |
          bundle exec ruby -rferrum -e 'b = Ferrum::Browser.new(timeout: 120, process_timeout: 120); b.go_to("data:text/html,<p>warm</p>"); b.quit'
      - name: Build and test with Rake
        run: bundle exec rake --trace
