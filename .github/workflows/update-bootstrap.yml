name: Update Bootstrap

# Re-import the dist files from an upstream twbs/bootstrap release tag (or
# branch/commit). The gem tracks a fixed pre-release tag, so this no longer
# runs on a schedule: when a new Bootstrap 6 tag is published, dispatch it
# with that tag and bump the `default` below. If the tracked ref differs from
# what is checked in, the assets are re-imported, the version synced, the
# stylesheets verified to still compile, and the result committed.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream twbs/bootstrap tag (or branch/commit) to import
        required: false
        default: v6.0.0-alpha.1

permissions:
  contents: write

concurrency:
  group: update-bootstrap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/gemfiles/rails_7_0_dartsass.gemfile
      UPSTREAM_REF: ${{ github.event.inputs.ref || 'v6.0.0-alpha.1' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Import Bootstrap and sync version
        id: update
        run: |
          bundle exec rake update"[$UPSTREAM_REF]"
          bundle exec rake sync_version"[$UPSTREAM_REF]"
          # Only consider the update's own outputs, never stray CI artifacts.
          if [ -n "$(git status --porcelain -- assets lib/bootstrap/version.rb)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with twbs/bootstrap@${UPSTREAM_REF}."
          fi

      - name: Verify the stylesheets still compile
        if: steps.update.outputs.changed == 'true'
        run: bundle exec rake debug

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          sha=$(grep -oE "[0-9a-f]{40}" lib/bootstrap/version.rb | head -1)
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets lib/bootstrap/version.rb
          git commit -m "Update Bootstrap to twbs/bootstrap@${UPSTREAM_REF} (${sha})"
          git push
